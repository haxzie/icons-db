name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `opennextjs-cloudflare build` opens a remote binding session (D1 and the
    # avatar bucket are `remote: true`, and Workers AI has no local emulation),
    # so the check needs the same credentials the deploy does. Without them the
    # build fails before it compiles anything.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: packages/icon-index/.model-cache
          key: bge-small-en-v1.5-${{ hashFiles('packages/icon-index/src/embed.ts') }}
      - run: pnpm index:build && pnpm --filter @icons-db/icon-index embed
      - run: node scripts/sync-data.mjs && node scripts/build-blog.mjs && npx wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts
        working-directory: apps/web
      - run: pnpm --filter @icons-db/core typecheck && pnpm --filter @icons-db/web typecheck && pnpm --filter @icons-db/web lint && pnpm --filter @icons-db/web test
      - run: npx opennextjs-cloudflare build
        working-directory: apps/web
